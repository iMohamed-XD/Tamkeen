[project]
name = "8-deep-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "importlib-resources>=7.1.0",
    "jupyter>=1.1.1",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "tensorflow-datasets>=4.9.10",
]

[project.scripts]
8-deep-learning = "_8_deep_learning:main"

[tool.uv.build-backend]
module-name = "_8_deep_learning"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
