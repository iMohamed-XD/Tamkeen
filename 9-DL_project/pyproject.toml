[project]
name = "9-dl-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad", email = "mohammad.ferasamin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "importlib-resources>=7.1.0",
    "jupyter>=1.1.1",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "tensorflow-datasets>=4.9.10",
    "ultralytics>=8.4.219",
]

[project.scripts]
9-dl-project = "_9_dl_project:main"

[tool.uv.build-backend]
module-name = "_9_dl_project"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
