[project]
name = "2-apis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamad Firas Amin", email = "mohammad.ferasamin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.24.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
2-apis = "2_apis:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.8",
]
